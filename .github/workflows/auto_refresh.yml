name: Auto Refresh IPTV Playlist

on:
  schedule:
    # প্রতি ২ ঘণ্টা পর পর এই স্ক্রিপ্টটি স্বয়ংক্রিয়ভাবে ব্যাকগ্রাউন্ডে রান হবে (Cron Job)
    - cron: '0 */2 * * *'
  workflow_dispatch: # এটি দেওয়ার কারণে আপনি চাইলে গিটহাবে ঢুকে ম্যানুয়ালিও "Run" বাটন চেপে যেকোনো সময় লিঙ্ক আপডেট করতে পারবেন

jobs:
  refresh-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper Script
      run: python updater.py

    - name: Commit and Push Updates
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Action Bot"
        git add sports.m3u
        git diff-index --quiet HEAD || git commit -m "Automated Playlist Token Refresh"
        git push
